<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskihwa</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="appname">
        Taskihwa
    </div>
    <nav class="big-container">
        <div class="featureslist">
            <li>
                <ol>Dashboard</ol>
            </li>
            <li>
                <ol>My Tasks</ol>
            </li>
        </div>
    </nav>
    <div id="addtask">
        <input id="input-name" type="text" placeholder="Write Tasks" name="writetasks">
        <button id="button" type="button">+</button>
    </div>
    <div class="my-tasks">
        <h2>My Tasks</h2>

    </div>
    <div class="task-list">
        <ul id="list">
            <li class="task">
                <input type="checkbox">
                <span class="title">Finish report</span>
                <span class="date">Today</span>
            </li>
        </ul>
    </div>
    <script src="main.js" defer></script>
</body>

</html>
